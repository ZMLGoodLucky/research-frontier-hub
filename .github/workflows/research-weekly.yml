name: Daily Research Watch + GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 09:00 Beijing time (Asia/Shanghai) = 01:00 UTC.
    # GitHub scheduled workflows may start later than the exact minute.
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frontierlab-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector syntax and unit tests
        run: |
          python -m py_compile scripts/collect.py scripts/extra_sources.py scripts/venue_metadata.py scripts/refresh_research_ideas.py
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/ideas.js
          node --check site/navigation.js
          node --check site/settings.js
      - name: Collect papers and official RSS feeds
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python scripts/collect.py
      - name: Save updated data to repository
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/seed.js site/digest_history.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh daily research metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
