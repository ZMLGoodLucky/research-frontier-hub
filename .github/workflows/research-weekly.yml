name: Weekly Research Watch + GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Friday 09:00 Asia/Shanghai / Asia/Manila = Friday 01:00 UTC.
    # GitHub scheduled workflows may start later than the exact minute.
    - cron: '0 1 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frontierlab-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect papers and official RSS feeds
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/collect.py
      - name: Save updated data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/seed.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh weekly research metadata'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
